name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install completion test shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish shellcheck zsh
      - name: Install ShellCheck
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Compatibility job: exercise the newest available Go 1.26 patch.
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Verify
        run: make all

  release-toolchain-quality:
    name: Quality (release Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install completion test shells
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish shellcheck zsh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify with release toolchain
        run: make all

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -mod=readonly -trimpath -buildvcs=false -o /tmp/timer-cli ./cmd/timer-cli

  package:
    name: Verify release packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build and compare release artifacts
        run: |
          version="$(bash scripts/source-version.sh)"
          bash scripts/verify-release.sh "$version" dist
      - name: Transfer verified packaging inputs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timer-cli-ci-packages-${{ github.sha }}-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  package-snap:
    name: Package smoke (Snap ${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified packaging inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timer-cli-ci-packages-${{ github.sha }}-${{ github.run_id }}
          path: dist
      - name: Prepare native Snapcraft project
        shell: bash
        run: |
          version="$(sed -n 's#^  url ".*/v\([^/"[:space:]]*\)/.*$#\1#p' dist/timer-cli.rb)"
          bash scripts/validate-version.sh "$version"
          bash scripts/prepare-snap.sh "$version" "${{ matrix.arch }}" dist "build/snap-${{ matrix.arch }}"
      - name: Build native snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          path: build/snap-${{ matrix.arch }}
      - name: Install and exercise snap
        shell: bash
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          version="$(sed -n 's#^  url ".*/v\([^/"[:space:]]*\)/.*$#\1#p' dist/timer-cli.rb)"
          bash scripts/validate-version.sh "$version"
          sudo snap install --dangerous "$SNAP_PATH"
          trap 'sudo snap remove timer-cli' EXIT
          test "$(snap run timer-cli version)" = "timer-cli $version (commit $(git rev-parse --short=12 HEAD), built $(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ))"
          test "$(snap run timer-cli 1 segundo --lang es --final-only --no-bell)" = "¡Se acabó el tiempo!"
          test -f /snap/timer-cli/current/share/doc/timer-cli/LICENSE
          test -f /snap/timer-cli/current/share/doc/timer-cli/THIRD_PARTY_LICENSES

  package-homebrew:
    name: Package smoke (Homebrew ${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name == 'push'
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified packaging inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timer-cli-ci-packages-${{ github.sha }}-${{ github.run_id }}
          path: dist
      - name: Build, test, and style local formula
        shell: bash
        env:
          HOMEBREW_DEVELOPER: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi
          command -v brew
          version="$(sed -n 's#^  url ".*/v\([^/"[:space:]]*\)/.*$#\1#p' dist/timer-cli.rb)"
          bash scripts/validate-version.sh "$version"
          archive_name="timer-cli_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          archive="$GITHUB_WORKSPACE/dist/${archive_name}.tar.gz"
          test -f "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/$archive_name/timer-cli"
          test -x "$binary"
          commit="$(git rev-parse --short=12 HEAD)"
          source_epoch="$(git log -1 --format=%ct)"
          if [[ "$RUNNER_OS" == Linux ]]; then
            build_date="$(date -u -d "@$source_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          else
            build_date="$(date -u -r "$source_epoch" +%Y-%m-%dT%H:%M:%SZ)"
          fi
          test "$("$binary" version)" = "timer-cli $version (commit $commit, built $build_date)"
          test "$("$binary" 1 segundo --lang es --final-only --no-bell)" = "¡Se acabó el tiempo!"
          source_archive="$GITHUB_WORKSPACE/dist/timer-cli_${version}_source.tar.gz"
          source_sha256="$(shasum -a 256 "$source_archive" | awk '{print $1}')"
          fixture="$RUNNER_TEMP/timer-cli.rb"
          cp dist/timer-cli.rb "$fixture"
          ruby -e '
            path, url, sha256 = ARGV
            formula = File.read(path)
            abort "missing formula URL" unless formula.sub!(/^  url ".*"$/, %(  url "#{url}"))
            abort "missing formula checksum" unless formula.sub!(/^  sha256 ".*"$/, %(  sha256 "#{sha256}"))
            File.write(path, formula)
          ' "$fixture" "file://$source_archive" "$source_sha256"
          grep -Fxq "  url \"file://$source_archive\"" "$fixture"
          brew install --build-from-source "$fixture"
          brew test "$fixture"
          style_formula="$RUNNER_TEMP/homebrew-style/Formula/timer-cli.rb"
          mkdir -p "$(dirname "$style_formula")"
          cp dist/timer-cli.rb "$style_formula"
          brew style --formula "$style_formula"
          brew uninstall timer-cli

  package-aur:
    name: Package smoke (AUR)
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel-20260809.0.570793@sha256:49facfaf7eac45ed51ea3056091b8478191df5bcd62225e457e89c246b7cbda3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified packaging inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timer-cli-ci-packages-${{ github.sha }}-${{ github.run_id }}
          path: dist
      - name: Prepare local AUR build environment
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm go
          useradd --create-home package-builder
          version="$(sed -n 's#^  url ".*/v\([^/"[:space:]]*\)/.*$#\1#p' dist/timer-cli.rb)"
          bash scripts/validate-version.sh "$version"
          mkdir -p build/aur
          tar -xzf "dist/timer-cli_${version}_aur.tar.gz" -C build/aur
          package_dir="$GITHUB_WORKSPACE/build/aur/timer-cli_${version}_aur"
          cp "dist/timer-cli_${version}_source.tar.gz" "$package_dir/timer-cli-${version}.tar.gz"
          chown -R package-builder:package-builder "$package_dir"
      - name: Build and validate AUR package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's#^  url ".*/v\([^/"[:space:]]*\)/.*$#\1#p' dist/timer-cli.rb)"
          package_dir="$GITHUB_WORKSPACE/build/aur/timer-cli_${version}_aur"
          runuser -u package-builder -- env PACKAGE_DIR="$package_dir" bash -c "
            set -euo pipefail
            cd \"\$PACKAGE_DIR\"
            makepkg --verifysource --noconfirm
            makepkg --cleanbuild --clean --noconfirm
            makepkg --printsrcinfo >.SRCINFO.actual
            cmp --silent .SRCINFO .SRCINFO.actual
          "
          mapfile -t packages < <(find "$package_dir" -maxdepth 1 -type f -name 'timer-cli-[0-9]*-x86_64.pkg.tar.zst' -print)
          test "${#packages[@]}" -eq 1
          pacman -U --noconfirm "${packages[0]}"
          test "$(timer-cli version)" = "timer-cli $version"
          test "$(timer-cli 1 segundo --lang es --final-only --no-bell)" = "¡Se acabó el tiempo!"
          test -f /usr/share/licenses/timer-cli/LICENSE
          test -f /usr/share/licenses/timer-cli/THIRD_PARTY_LICENSES
          pacman -R --noconfirm timer-cli
